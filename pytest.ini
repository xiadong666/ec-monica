[pytest]
# ==========================================================================
# EC-Monica pytest 配置
# ==========================================================================

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义 marker
#   offline —— 不依赖 LLM，CI 必跑
#   live    —— 需要真实 LLM，用 -m live 显式启用
markers =
    offline: 离线评测，不依赖 LLM（秒级、免费、可复现）
    live: 在线评测，需要真实 LLM（分钟级、有成本、有随机性）
    pg: 需要真实 PostgreSQL（配置 DATABASE_URL 后才跑）

# ★ 默认只跑 offline + pg 的跳过分支。
#   · live 会产生真实 API 费用 → 默认排除，需要时显式 -m live
#   · pg 需要外部数据库 → 有 DATABASE_URL 时才会真正执行，否则 skip
#     （注意：pg 标记的用例**不在** offline 组，但它们自带 skipif，
#       所以 CI 里跑 -m "offline or pg" 时无 PG 也只是 skip 而不失败）
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -m "offline or pg"

# 日志：让 pytest 捕获的日志在失败时显示
log_cli = false
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
